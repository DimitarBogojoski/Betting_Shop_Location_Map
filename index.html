<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GDI</title>

    <script type="module" src="https://js.arcgis.com/5.0/"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="Js/Contact.js" defer></script>
    <script src="Js/Navigation.js" defer></script>
    <script src="Js/Map.js" defer></script>

    <link href="Css/Contact.css" rel="stylesheet">
    <link href="Css/Map.css" rel="stylesheet">
    <link rel="stylesheet" href="https://js.arcgis.com/5.0/esri/themes/light/main.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="Css/Navigation.css" rel="stylesheet" />
    <link href="Css/Footer.css" rel="stylesheet" />
    <link href="Css/Gallery.css" rel="stylesheet">
    <link href="Css/Video.css" rel="stylesheet">
</head>
<body>
<!--Nav-->
<nav class="navbar bg-header">
    <div class="container-fluid header-layout">
        <div class="header-left d-flex align-items-center gap-2">
            <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="offcanvas"
                    data-bs-target="#navigationSidebar"
                    aria-controls="navigationSidebar"
                    aria-label="Open navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>
            <a href="#Map" aria-label="GDI home" class="ms-3">
                <img src="Images/GDI.webp" alt="GDI" class="small-round-img header-gdi-logo">
            </a>
        </div>

        <a class="navbar-brand header-title">
            <span>Esri Represent</span>
        </a>

        <div class="header-language">
            <div class="dropdown">
                <button
                        class="btn language-toggle dropdown-toggle"
                        type="button"
                        id="languageDropdown"
                        data-bs-toggle="dropdown"
                        aria-expanded="false"
                        aria-label="Choose language"
                >
                    <img src="Images/Flags/Mk.webp" alt="" class="small-img-flags" id="selected-language-flag">
                    <span id="selected-language-label">MK</span>
                </button>

                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="languageDropdown">
                    <li>
                        <button
                                class="dropdown-item"
                                type="button"
                                data-language="MK"
                                data-flag="Images/Flags/Mk.webp"
                        >
                            <img src="Images/Flags/Mk.webp" alt="" class="small-img-flags">
                            Македонски
                        </button>
                    </li>

                    <li>
                        <button
                                class="dropdown-item "
                                type="button"
                                data-language="EN"
                                data-flag="Images/Flags/Uk.webp"
                        >
                            <img src="Images/Flags/Uk.webp" alt="" class="small-img-flags" >
                            English
                        </button>
                    </li>

                    <li>
                        <button
                                class="dropdown-item "
                                type="button"
                                data-language="SQ"
                                data-flag="Images/Flags/Al.webp"
                        >
                            <img src="Images/Flags/Al.webp" alt="" class="small-img-flags">
                            Shqip
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<!--Sidebar-->
<div
        class="offcanvas offcanvas-start bg-header sidebar-size"
        tabindex="-1"
        id="navigationSidebar"
        aria-labelledby="navigationSidebarLabel"
>
    <div class="offcanvas-header">
        <h2 class="offcanvas-title fs-5" id="navigationSidebarLabel">
            Навигација
        </h2>

        <button
                type="button"
                class="btn-close"
                data-bs-dismiss="offcanvas"
                aria-label="Close navigation"
        ></button>
    </div>

    <div class="offcanvas-body">
        <nav aria-label="Main navigation">
            <ul class="nav flex-column gap-2 sidebar-links">
                <li class="nav-item">
                    <a class="nav-link nonHyperLink" href="#Map">Почетна</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nonHyperLink" href="#Video">Видео</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nonHyperLink" href="#Gallery">Галерија</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nonHyperLink" href="#Contact">Контакт</a>
                </li>
            </ul>
        </nav>
    </div>
</div>


<main id="main-content"></main>

<footer class="footer bg-footer company-footer">
    <div class="container-fluid">
        <div class="row gx-2 gy-2 align-items-center">

            <!-- Left: Social icons -->
            <div class="col-4">
                <div class="d-flex align-items-center gap-2 footer-socials">
                    <a href="https://www.instagram.com/gdionegroup/?hl=en">
                        <img
                                src="Images/SocialMedia/icons8-instagram-24.png"
                                alt="Instagram"
                        >
                    </a>

                    <a href="https://www.facebook.com/gdigroup">
                        <img
                                src="Images/SocialMedia/icons8-facebook-24.png"
                                alt="Facebook"
                        >
                    </a>

                    <a href="https://x.com/">
                        <img
                                src="Images/SocialMedia/icons8-twitter-24.png"
                                alt="X (Twitter)"
                        >
                    </a>

                    <a href="https://www.linkedin.com/company/gdi-group/home/">
                        <img
                                src="Images/SocialMedia/icons8-linkedin-24.png"
                                alt="LinkedIn"
                        >
                    </a>
                </div>
            </div>

            <!-- Center: Copyright -->
            <div class="col-4 text-center fw-bold">
                <p class="mb-0 text-nowrap">© GDI Skopje</p>
            </div>

            <!-- Right: Contact -->
            <div class="col-4 text-end">
                <a href="#Contact" class="nonHyperLink text-nowrap">
                    Контактирајте нè
                </a>
            </div>

        </div>
    </div>
</footer>
</body>
</html>
