<div class="zoom-fixed-shell zoom-fixed-gallery-shell">

    <section id="gallery-page"
             class="container-fluid py-5 zoom-fixed-element"
             aria-labelledby="gallery-title">

        <h1 id="gallery-title"
            class="text-center mb-4"
            data-i18n="gallery"></h1>

        <div id="galleryCarousel"
             class="carousel slide gallery-carousel"
             role="region"
             aria-label="Фотографии од галеријата">

            <div class="carousel-indicators">
                <button type="button" data-bs-target="#galleryCarousel"
                        data-bs-slide-to="0" class="active"
                        aria-current="true" aria-label="Фотографија 1"></button>

                <button type="button" data-bs-target="#galleryCarousel"
                        data-bs-slide-to="1"
                        aria-label="Фотографија 2"></button>

                <button type="button" data-bs-target="#galleryCarousel"
                        data-bs-slide-to="2"
                        aria-label="Фотографија 3"></button>

                <button type="button" data-bs-target="#galleryCarousel"
                        data-bs-slide-to="3"
                        aria-label="Фотографија 4"></button>
            </div>

            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="Images/Clubs/M1.jpg"
                         alt="Фотографија 1"
                         fetchpriority="high">
                </div>

                <div class="carousel-item">
                    <img src="Images/Clubs/M2.webp"
                         alt="Фотографија 2"
                         loading="lazy">
                </div>

                <div class="carousel-item">
                    <img src="Images/Clubs/SL.webp"
                         alt="Фотографија 3"
                         loading="lazy">
                </div>

                <div class="carousel-item">
                    <img src="Images/Clubs/ZK.jpg"
                         alt="Фотографија 4"
                         loading="lazy">
                </div>
            </div>

            <button class="carousel-control-prev"
                    type="button"
                    data-bs-target="#galleryCarousel"
                    data-bs-slide="prev"
                    aria-label="Претходна фотографија">
                <span class="carousel-control-prev-icon"
                      aria-hidden="true"></span>
            </button>

            <button class="carousel-control-next"
                    type="button"
                    data-bs-target="#galleryCarousel"
                    data-bs-slide="next"
                    aria-label="Следна фотографија">
                <span class="carousel-control-next-icon"
                      aria-hidden="true"></span>
            </button>

        </div>
    </section>

</div>
