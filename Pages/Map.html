<div class="map-page">
    <div id="map-view" class="map-view"></div>
</div>

<section class="objects-section py-4" aria-label="Табела со објекти">
    <div class="row mb-3">
        <div class="col-12 col-md-4 col-lg-3">
            <input
                    type="search"
                    id="objects-search"
                    class="form-control"
                    placeholder="Пребарај"
                    aria-label="Пребарај во табелата"
                    data-i18n-placeholder="search"
                    data-i18n-aria="search"
            >
        </div>
    </div>
    <!-- Table -->
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle objects-table ">
            <thead>
            <tr>
                <th
                        scope="col"
                        data-sort-key="objectId"
                >
                    <button
                            type="button"
                            class="objects-sort-button"
                    >
                <span
                        data-i18n="objectId"
                >OBJECT ID</span>

                        <span
                                class="objects-sort-icon"
                                aria-hidden="true"
                        ></span>
                    </button>
                </th>

                <th
                        scope="col"
                        data-sort-key="name"
                >
                    <button
                            type="button"
                            class="objects-sort-button"
                    >
                <span
                        data-i18n="objectName"
                >ИМЕ</span>

                        <span
                                class="objects-sort-icon"
                                aria-hidden="true"
                        ></span>
                    </button>
                </th>

                <th
                        scope="col"
                        data-sort-key="address"
                >
                    <button
                            type="button"
                            class="objects-sort-button"
                    >
                <span
                        data-i18n="address"
                >АДРЕСА</span>

                        <span
                                class="objects-sort-icon"
                                aria-hidden="true"
                        ></span>
                    </button>
                </th>
            </tr>
            </thead>

            <tbody id="objects-table-body"></tbody>
        </table>
    </div>

    <!-- Same line: Rows per page LEFT, pagination RIGHT -->
    <div class="d-flex justify-content-between align-items-center gap-3">

        <div class="d-flex align-items-center gap-2 flex-shrink-0">
            <label
                    for="objects-page-size" class="text-nowrap small" data-i18n="rowsPerPage">
                Редови по страница:
            </label>

            <select
                    id="objects-page-size"
                    class="form-select form-select-sm"
                    style="width: auto;"
            >
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="20">20</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
        </div>

        <nav
                class="objects-pagination"
                aria-label="Страници на табелата"
                style="min-width: 0; overflow-x: auto;"
        >
            <ul
                    id="objects-pagination"
                    class="pagination pagination-sm mb-0"
            ></ul>
        </nav>

    </div>

    <!-- Below: Export on the right -->
    <div class="d-flex justify-content-end gap-2 mt-2">
        <button
                type="button"
                class="btn bt-color"
                id="export-objects"
                data-i18n="export"
        >
            Експортирај
        </button>
    </div>

    <!-- Record summary -->
    <p
            id="objects-table-summary"
            class="small text-secondary text-end mt-2 mb-0"
            role="status"
    ></p>

</section>
